name: Language Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
  pull_request:
    paths:
      - 'app/src/main/java/com/charles/livecaptionn/translation/**'
      - 'app/src/main/java/com/charles/livecaptionn/speech/**'
      - 'app/src/main/java/com/charles/livecaptionn/settings/Language.kt'
      - 'app/src/androidTest/java/com/charles/livecaptionn/AllLanguagesVerificationTest.kt'
      - 'app/src/androidTest/java/com/charles/livecaptionn/VoskAllLanguagesTest.kt'
      - 'app/src/androidTest/java/com/charles/livecaptionn/MlKitAllLanguagesTest.kt'
      - 'app/src/test/java/com/charles/livecaptionn/LanguageCatalogIntegrityTest.kt'
      - '.github/workflows/language-verification.yml'

permissions:
  contents: read

jobs:
  tier1-catalog-integrity:
    name: Tier 1 - catalog integrity + Vosk URL check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"0","project_id":"placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.charles.livecaptionn"}},"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          fi
      - name: Catalog integrity unit tests
        run: ./gradlew testGithubDebugUnitTest --tests "com.charles.livecaptionn.LanguageCatalogIntegrityTest" --tests "com.charles.livecaptionn.VoskModelCatalogTest" --tests "com.charles.livecaptionn.LanguageTest"
      - name: Check every Vosk download URL resolves
        run: |
          set -u
          catalog=app/src/main/java/com/charles/livecaptionn/speech/VoskModelCatalog.kt
          models=$(grep -oE '"vosk-model-[a-z0-9.-]+"' "$catalog" | tr -d '"' | sort -u)
          echo "### Vosk model URL check" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for m in $models; do
            url="https://alphacephei.com/vosk/models/$m.zip"
            headers=$(curl -sI --max-time 60 "$url")
            code=$(echo "$headers" | head -1 | awk '{print $2}')
            echo "$m -> HTTP $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          if [ "$fail" != "0" ]; then echo "::error::At least one Vosk model URL did not return HTTP 200"; exit 1; fi
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  tier2-emulator-sweep:
    name: Tier 2 - emulator ML Kit sweep + Vosk subset
    if: github.event_name != 'pull_request'
    needs: tier1-catalog-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate app/google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
      - name: ML Kit all-language sweep + Vosk subset on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 16384M
          heap-size: 1024M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # The ML Kit sweep runs in 6 chunks (one gradle invocation each,
          # scoped by -e mlkitLanguages). Run #5 (2026-11-24) ran all 58
          # languages in a single test/process: it crashed ~18 minutes in
          # ("Process crashed") and every remaining language's result was
          # lost. Chunking means one chunk's crash cannot hide the others;
          # each chunk's reports are copied aside before the next starts,
          # and the step fails at the end if any chunk failed.
          script: |
            mkdir -p app/build/outputs/tier2-chunks
            run_chunk() {
              name="$1"; langs="$2"
              echo "=== ML Kit chunk $name: $langs ==="
              ./gradlew connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.charles.livecaptionn.AllLanguagesVerificationTest -Pandroid.testInstrumentationRunnerArguments.mlkitLanguages=$langs \
                || echo "$name" >> app/build/outputs/tier2-chunks/FAILED_CHUNKS.txt
              mkdir -p "app/build/outputs/tier2-chunks/$name"
              cp -r app/build/outputs/androidTest-results "app/build/outputs/tier2-chunks/$name/" || true
              cp -r app/build/reports/androidTests "app/build/outputs/tier2-chunks/$name/" || true
            }
            run_chunk chunk1 af,ar,be,bg,bn,ca,cs,cy,da,de
            run_chunk chunk2 el,eo,es,et,fa,fi,fr,ga,gl,gu
            run_chunk chunk3 he,hi,hr,ht,hu,id,is,it,ja,ka
            run_chunk chunk4 kn,ko,lt,lv,mk,mr,ms,mt,nl,no
            run_chunk chunk5 pl,pt,ro,ru,sk,sl,sq,sv,sw,ta
            run_chunk chunk6 te,th,tl,tr,uk,ur,vi,zh
            ./gradlew connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.charles.livecaptionn.VoskAllLanguagesTest -Pandroid.testInstrumentationRunnerArguments.voskLanguages=es,de,ru,ja,zh \
              || echo "vosk" >> app/build/outputs/tier2-chunks/FAILED_CHUNKS.txt
            if [ -s app/build/outputs/tier2-chunks/FAILED_CHUNKS.txt ]; then echo "Failed chunks:"; cat app/build/outputs/tier2-chunks/FAILED_CHUNKS.txt; exit 1; fi
      - name: Upload test reports and per-language results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-language-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/tier2-chunks/
          if-no-files-found: ignore
