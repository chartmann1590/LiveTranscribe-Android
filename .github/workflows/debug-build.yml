name: Debug APK Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create placeholder Google Services config
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.charles.livecaptionn"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build GitHub Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionN-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
