name: Build signed LiveCaptionN Play candidate (no upload)
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: lcn-play-signed-bundle-preflight
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'chartmann1590/LiveTranscribe-Android' && github.ref == 'refs/heads/main' && github.actor == 'chartmann1590'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the reviewed application base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '75771cd735210ed7804b2cb55991dcb2b05008f4'
          persist-credentials: false
          fetch-depth: 1
      - name: Apply the reviewed Play recovery patches
        run: |
          test "$(git rev-parse HEAD)" = '75771cd735210ed7804b2cb55991dcb2b05008f4'
          test -n "$JAVA_HOME_17_X64" && test -x "$JAVA_HOME_17_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          printf 'ANDROID_VERSION_CODE=%s\nANDROID_VERSION_NAME=1.0.%s\n' "$(date -u +%y%j%H%M)" "$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' >/dev/null
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,os,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          items=(
            ('8304dd38ce2d247f2f8995fb62865f24c986a65a063804b4a611e15ae9af977f', ''),
            ('eb26784c549e73c60acc497fcf426ffc2c0d51567c199d5e3bfe6fce49726093', ''),
          )
          for idx,(expected, data) in enumerate(items):
             patch=gzip.decompress(base64.b64decode(data,validate=True))
             assert hashlib.sha256(patch).hexdigest()==expected
             p=root/f'lcn-reviewed-panel-{idx}.patch';p.write_bytes(patch)
             subprocess.run(['git','apply','--check',str(p)],check=True)
             subprocess.run(['git','apply',str(p)],check=True)
          PY
      - name: Verify configuration, sign and inspect; never upload
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
          ADMOB_NATIVE_ID_RELEASE: ${{ secrets.ADMOB_NATIVE_ID_RELEASE }}
          ADMOB_APP_OPEN_ID_RELEASE: ${{ secrets.ADMOB_APP_OPEN_ID_RELEASE }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- app/google-services.json local.properties keystore.properties app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab "$RUNNER_TEMP/lcn-production-signing.jks" "$RUNNER_TEMP/lcn-unit.log" "$RUNNER_TEMP/lcn-build.log"' EXIT
          python3 - <<'PY'
          import os,json,pathlib,re,base64
          P=pathlib.Path; e=os.environ; secret_path=P(e['RUNNER_TEMP'])/'lcn-production-signing.jks'
          expected={'ADMOB_APP_ID': 'ca-app-pub-8382831211800454~6962874109', 'ADMOB_BANNER_ID_RELEASE': 'ca-app-pub-8382831211800454/2231636617', 'ADMOB_NATIVE_ID_RELEASE': 'ca-app-pub-8382831211800454/3327966560', 'ADMOB_APP_OPEN_ID_RELEASE': 'ca-app-pub-8382831211800454/6447868787'}
          for k,v in expected.items():
              if e.get(k)!=v:raise SystemExit('production ad configuration does not match the existing Play AdMob record')
          try:
              cfg=json.loads(e['GOOGLE_SERVICES_JSON']); pkg='com.charles.livecaptionn'
              clients=[c for c in cfg.get('client',[]) if c.get('client_info',{}).get('android_client_info',{}).get('package_name')==pkg]
              assert len(clients)==1 and clients[0]['client_info']['mobilesdk_app_id'] and any(re.fullmatch(r'AIza[0-9A-Za-z_\-]{35}',k.get('current_key','')) for k in clients[0]['api_key'])
              P('app/google-services.json').write_text(e['GOOGLE_SERVICES_JSON'])
              signing=[str(secret_path),e['ANDROID_KEYSTORE_PASSWORD'],e['ANDROID_KEY_ALIAS'],e['ANDROID_KEY_PASSWORD']]
              assert all(s and not any(c in s for c in '\r\n\x00') for s in signing)
              # Escape Java properties values, including leading/trailing spaces and non-ASCII.
              def prop(s):
                  utf=s.encode('utf-16-be'); return ''.join(chr(v) if 33<=v<127 and v!=92 else ('\\u%04x' % v) for v in (int.from_bytes(utf[i:i+2],'big') for i in range(0,len(utf),2)))
              keystore=base64.b64decode(''.join(e['ANDROID_KEYSTORE_B64'].split()),validate=True); assert keystore
              secret_path.write_bytes(keystore)
              P('keystore.properties').write_text(''.join(k+'='+prop(v)+'\n' for k,v in zip(('storeFile','storePassword','keyAlias','keyPassword'),signing)))
          except Exception: raise SystemExit('verified signing or Firebase configuration unavailable')
          P('local.properties').write_text('ads.enabled=true\n'+''.join('ads.'+k.lower().replace('_','.')+'='+e[k]+'\n' for k in expected))
          PY
          unset GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ADMOB_APP_ID ADMOB_APP_OPEN_ID_RELEASE ADMOB_BANNER_ID_RELEASE ADMOB_NATIVE_ID_RELEASE
          if ! bash ./gradlew --no-daemon --max-workers=2 :app:testPlaystoreDebugUnitTest > "$RUNNER_TEMP/lcn-unit.log" 2>&1; then
            echo 'Play unit tests failed (log withheld to avoid credential exposure).'; exit 1
          fi
          if ! bash ./gradlew --no-daemon --max-workers=2 :app:bundlePlaystoreRelease > "$RUNNER_TEMP/lcn-build.log" 2>&1; then
            echo 'Signed Play build failed (log withheld to avoid credential exposure).'; exit 1
          fi
          aab='app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab'
          test -s "$aab"
          jarsigner -verify "$aab" > "$RUNNER_TEMP/lcn-jarsigner.log" 2>&1
          grep -q '^jar verified\.' "$RUNNER_TEMP/lcn-jarsigner.log"
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/lcn-signer.txt"
          grep -Fq 'AE:C5:97:B7:66:56:5E:A4:34:80:22:3C:BD:8A:A1:6C:DB:FF:43:B1:7A:11:0C:21:95:72:FF:1D:AC:81:3C:EC' "$RUNNER_TEMP/lcn-signer.txt"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 45 -o "$RUNNER_TEMP/lcn-bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  %s\n' "$RUNNER_TEMP/lcn-bundletool.jar" | sha256sum -c --status
          java -jar "$RUNNER_TEMP/lcn-bundletool.jar" validate --bundle="$aab" > /dev/null
          java -jar "$RUNNER_TEMP/lcn-bundletool.jar" dump manifest --bundle="$aab" > "$RUNNER_TEMP/lcn-manifest.xml"
          java -jar "$RUNNER_TEMP/lcn-bundletool.jar" dump config --bundle="$aab" > "$RUNNER_TEMP/lcn-bundleconfig.txt"
          python3 - <<'PY'
          import hashlib,json,re,pathlib,os,xml.etree.ElementTree as ET,zipfile
          P=pathlib.Path; t=P(os.environ['RUNNER_TEMP']); aab=P('app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab'); ns='{http://schemas.android.com/apk/res/android}'; m=ET.parse(t/'lcn-manifest.xml').getroot()
          assert m.attrib.get('package')=='com.charles.livecaptionn'
          assert m.attrib.get(ns+'versionCode')==os.environ['ANDROID_VERSION_CODE']
          assert m.find('uses-sdk').attrib[ns+'targetSdkVersion']=='36'
          md=[n.get(ns+'value') for n in m.findall('./application/meta-data') if n.get(ns+'name')=='com.google.android.gms.ads.APPLICATION_ID']
          assert md==['ca-app-pub-8382831211800454~6962874109']
          assert not any(p.get(ns+'name')=='android.permission.REQUEST_INSTALL_PACKAGES' for p in m.findall('uses-permission'))
          assert 'PAGE_ALIGNMENT_16K' in (t/'lcn-bundleconfig.txt').read_text()
          with zipfile.ZipFile(aab) as z:
             bill=[z.read(p) for p in z.namelist() if p.endswith('/billing.properties')]
             assert any(re.search(rb'(?m)^version=9\.1\.0\s*$', b) for b in bill), 'expected Play Billing version absent'
             dex=[z.read(n) for n in z.namelist() if re.fullmatch(r'base/dex/classes\d*\.dex',n)]
             for x in ['ca-app-pub-8382831211800454/2231636617', 'ca-app-pub-8382831211800454/3327966560', 'ca-app-pub-8382831211800454/6447868787']:
                 assert any(x.encode() in one for one in dex),'configured AdMob unit missing from release bytes'
             assert not any(b'ca-app-pub-8382831211800454~1744520915' in d for d in dex)
          count=sum(int(ET.parse(v).getroot().get('tests',0)) for v in P('app/build/test-results/testPlaystoreDebugUnitTest').glob('TEST-*.xml'))
          assert count>=173
          with aab.open('rb') as f: dg=hashlib.file_digest(f,'sha256').hexdigest()
          print('LCN_SIGNED_CANDIDATE_OK sha256='+dg+' versionCode='+os.environ['ANDROID_VERSION_CODE']+' unitTests='+str(count)+' productionAdIdsVerified=true uploaded=false')
          PY
