name: Build signed original LiveCaptionN bundle (encrypted output only)
permissions:
  contents: read
concurrency:
  group: lcn-play-signed-bundle-preflight
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'chartmann1590/LiveTranscribe-Android' && github.ref == 'refs/heads/play-recovery/lcn-october-2ed71507' && github.actor == 'chartmann1590'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out the reviewed application base only
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 8c47ba88941fc184dacfa146b3a80eb134bed56f
        persist-credentials: false
        fetch-depth: 1
    - name: Apply the approved reviewer access to the exact October checkout
      run: |
        test "$(git rev-parse HEAD)" = '8c47ba88941fc184dacfa146b3a80eb134bed56f'
        test -n "$JAVA_HOME_17_X64" && test -x "$JAVA_HOME_17_X64/bin/java"
        printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        printf '%s\n' "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        printf 'ANDROID_VERSION_CODE=%s\nANDROID_VERSION_NAME=%s\n' '263250107' '1.0.20261121.0107' >> "$GITHUB_ENV"
        test -f "$ANDROID_HOME/platforms/android-36/android.jar" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' >/dev/null
        test -z "$(git status --porcelain --untracked-files=no)"
        python3 - <<'PY'
        import base64, gzip, hashlib, pathlib, os
        p = gzip.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(p).hexdigest() == 'b3ba80beeeed9b44449cebff87a57d523892d70b9aa65db71f24eaf44807bd6c'
        pathlib.Path(os.environ['RUNNER_TEMP'], 'lcn-review-scope.patch').write_bytes(p)
        PY
        git apply --check --binary "$RUNNER_TEMP/lcn-review-scope.patch"
        git apply --binary "$RUNNER_TEMP/lcn-review-scope.patch"
        python3 - <<'PY'
        import hashlib, pathlib
        expected = {'app/build.gradle.kts': '44b656d2c50a80e1b21ee40808ab136c221e4ef0b462bbfc5643d670dfbb7a19', 'app/src/github/java/com/charles/livecaptionn/review/CreateReviewAccess.kt': '37e7c77c6ade0377787028d8c6fd30490460ce9788c61e0176efa01ede9816c5', 'app/src/main/java/com/charles/livecaptionn/ads/BannerAd.kt': '1366e8657e10d704c971c3a7b4b437c53f39deabb1b4c81a6527a79f4cedef17', 'app/src/main/java/com/charles/livecaptionn/di/AppContainer.kt': '2fcee668e5caa8c15960a18597fb33d9817d5cda22b9de7d82b5407bf72fbffe', 'app/src/main/java/com/charles/livecaptionn/review/ReviewAccess.kt': '7aa0f4a65a31a105d3d0399940c2f81280792eb47223499318fdbe5c5565a48c', 'app/src/main/java/com/charles/livecaptionn/review/ReviewAccessControl.kt': '8b1821a1c3740421fcd3265b08a383ff09e99be03e58890e580b9c3678df88e7', 'app/src/main/java/com/charles/livecaptionn/review/ReviewGrant.kt': '6534f8d69d7c074e125e0264f3c487d3862e60b1e75a6189e679bab1070b1515', 'app/src/main/java/com/charles/livecaptionn/service/CaptionForegroundService.kt': 'c2d4668ff67c2e58a658b9ff3399daa1d0a03bde2c2585f1e61dbf23d84aa78a', 'app/src/main/java/com/charles/livecaptionn/ui/MainScreen.kt': '7ed458a50fb2050f4aa074a9353118af0cd227e53f96df1f7035fb16540d5be0', 'app/src/playstore/java/com/charles/livecaptionn/review/CreateReviewAccess.kt': '8e36f708799b60cfc5f67b72e314a009b89c956bad193f74bc2a758a06c3aa9a', 'app/src/test/java/com/charles/livecaptionn/review/ReviewAccessUnitTest.kt': '0a4dc6b7ac17e6ec8b64810759beaef3e0209696924da72abf2ac6915ffcea29', 'review-demo-worker/src/worker.mjs': 'e7b40a7d50940244621b1cd12669bca0a0094c7096445ac1489258ead01d6441', 'review-demo-worker/worker.test.mjs': '40e14c4c602af2927096c5ca4b163666cb83eee5113b9ba49d04d82596a7e44f', 'review-demo-worker/wrangler.example.toml': '8070f13311e63310f5a57c687f7a26d8215a26860d26f542e3653952995accfc', 'app/src/github/java/com/charles/livecaptionn/billing/StripeBillingRepository.kt': 'fb9a3ba355f2db8427d70de8e229133f623da92b2fadf1218af84d4d4e328c90', 'app/src/github/java/com/charles/livecaptionn/billing/WorkerApi.kt': 'd71e27214469eab9b1beaff92a2fe61768f2818012469335bc82a96440e2a0ce', 'app/src/github/java/com/charles/livecaptionn/billing/WorkerClient.kt': '40bfb600e5e49a5fa5ceccce3ceb0d05b60c73cce29fb02d90a406ea4fdd9fae', 'app/src/github/java/com/charles/livecaptionn/billing/WorkerModels.kt': '6565e513e7a1a3c7d8e3671e9c9869437a09e78f9c63d626e6fd707d51fd78d8', 'app/src/main/java/com/charles/livecaptionn/billing/Entitlement.kt': '6751aad6ef9a97f059845b711f86fe31816e0a93a81d84f2cd9b2f302a67e7d0', 'app/src/main/java/com/charles/livecaptionn/billing/PremiumProduct.kt': 'c268ccfa9a45f7b0050998a6d112ced4d9d5c40eb1230c5160c2f106a4dd52f9', 'app/src/main/java/com/charles/livecaptionn/billing/PremiumRepository.kt': '215324ff6d5cd69bbcbc06f28d3026ffda22228273f16a972e2a9d26315759b9', 'app/src/main/java/com/charles/livecaptionn/billing/PremiumState.kt': '11da6ae29dd4f8c502c72f26af51c8021dc55b2b8ecf0a521d4fe29ee0c909d9', 'app/src/main/java/com/charles/livecaptionn/data/PremiumLocalStore.kt': '4a3e2e5684b51cd86aba0a288c70192dd6415d90defbb4164b8b18c793b8dde7', 'app/src/playstore/java/com/charles/livecaptionn/billing/BillingClientAdapter.kt': '20fa086677f68f8a5882a5929005c6668efc9f3670f8fa5e82debde29d031128', 'app/src/playstore/java/com/charles/livecaptionn/billing/PlayBillingRepository.kt': 'cde793e324aabaaf26683c047dec9af70846d96a30929478109afce4bef478b8', 'app/src/playstore/java/com/charles/livecaptionn/billing/PlayProductIds.kt': '27c491cf33c6e74d2af412d273c0a87921ed54a23250c7193a798bf41ead3e75', 'app/src/testPlaystore/java/com/charles/livecaptionn/billing/BillingMessagesTest.kt': '5747adf2b936c7106913acbb1a7c9d6b18ed8b45887f0b5873e23b1ad5390b1b'}
        for p, s in expected.items():
            assert hashlib.file_digest(pathlib.Path(p).open('rb'),'sha256').hexdigest()==s,p
        PY
        printf '%s\n' 'LCN_REVIEW_DEMO_ENDPOINT=https://lcn-play-review-demo.charles-h-hartmann1.workers.dev/v1/demo-session' 'LCN_REVIEW_DEMO_PUBLIC_KEY=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEA3EW//fhhbZb4+vQyAX1kRbNvpjcX9YXmfRioWTBEEs84br7rnI7mJWMdghTeQXVZ7kyL8A5kaYF6CqW/EgJBw==' >> "$GITHUB_ENV"
        rm -f "$RUNNER_TEMP/lcn-review-scope.patch"
    - name: Verify configuration, sign and inspect; never upload
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        ADMOB_NATIVE_ID_RELEASE: ${{ secrets.ADMOB_NATIVE_ID_RELEASE }}
        ADMOB_APP_OPEN_ID_RELEASE: ${{ secrets.ADMOB_APP_OPEN_ID_RELEASE }}
      run: |
        set -euo pipefail
        umask 077
        trap 'rm -f -- app/google-services.json local.properties keystore.properties app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab "$RUNNER_TEMP/lcn-production-signing.jks" "$RUNNER_TEMP/lcn-unit.log" "$RUNNER_TEMP/lcn-build.log"' EXIT
        python3 - <<'PY'
        import os,json,pathlib,re,base64
        P=pathlib.Path; e=os.environ; secret_path=P(e['RUNNER_TEMP'])/'lcn-production-signing.jks'
        expected={'ADMOB_APP_ID': 'ca-app-pub-8382831211800454~6962874109', 'ADMOB_BANNER_ID_RELEASE': 'ca-app-pub-8382831211800454/2231636617', 'ADMOB_NATIVE_ID_RELEASE': 'ca-app-pub-8382831211800454/3327966560', 'ADMOB_APP_OPEN_ID_RELEASE': 'ca-app-pub-8382831211800454/6447868787'}
        for k,v in expected.items():
            if e.get(k)!=v:raise SystemExit('production ad configuration does not match the existing Play AdMob record')
        try:
            cfg=json.loads(e['GOOGLE_SERVICES_JSON']); pkg='com.charles.livecaptionn'
            clients=[c for c in cfg.get('client',[]) if c.get('client_info',{}).get('android_client_info',{}).get('package_name')==pkg]
            assert len(clients)==1 and clients[0]['client_info']['mobilesdk_app_id'] and any(re.fullmatch(r'AIza[0-9A-Za-z_\-]{35}',k.get('current_key','')) for k in clients[0]['api_key'])
            P('app/google-services.json').write_text(e['GOOGLE_SERVICES_JSON'])
            signing=[str(secret_path),e['ANDROID_KEYSTORE_PASSWORD'],e['ANDROID_KEY_ALIAS'],e['ANDROID_KEY_PASSWORD']]
            assert all(s and not any(c in s for c in '\r\n\x00') for s in signing)
            # Escape Java properties values, including leading/trailing spaces and non-ASCII.
            def prop(s):
                utf=s.encode('utf-16-be'); return ''.join(chr(v) if 33<=v<127 and v!=92 else ('\\u%04x' % v) for v in (int.from_bytes(utf[i:i+2],'big') for i in range(0,len(utf),2)))
            keystore=base64.b64decode(''.join(e['ANDROID_KEYSTORE_B64'].split()),validate=True); assert keystore
            secret_path.write_bytes(keystore)
            P('keystore.properties').write_text(''.join(k+'='+prop(v)+'\n' for k,v in zip(('storeFile','storePassword','keyAlias','keyPassword'),signing)))
        except Exception: raise SystemExit('verified signing or Firebase configuration unavailable')
        P('local.properties').write_text('translate.url=http://localhost:3006\nstt.url=http://localhost:9000/asr?output=json\nads.enabled=true\n'+''.join('ads.'+k.lower().replace('_','.')+'='+e[k]+'\n' for k in expected))
        PY
        unset GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ADMOB_APP_ID ADMOB_APP_OPEN_ID_RELEASE ADMOB_BANNER_ID_RELEASE ADMOB_NATIVE_ID_RELEASE
        lcn_safe_diagnostic() {
          python3 - "$@" <<'LCN_SAFE_DIAGNOSTIC'
        import pathlib,re,sys,xml.etree.ElementTree as ET
        mode=sys.argv[1]
        assert mode in ('TEST','RELEASE')
        p=pathlib.Path(sys.argv[2]); content=''
        if p.is_file():
            with p.open('rb') as f:
                f.seek(max(0,p.stat().st_size-512*1024)); content=f.read(512*1024).decode('utf-8','replace')
        keys={
            'TEST_TASK_FAILED':r'(?im)> Task :app:testPlaystoreDebugUnitTest FAILED|\bThere were failing tests\b',
            'DEPENDENCY_RESOLUTION':r'(?i)could not resolve all (?:files|artifacts|dependencies)|could not find (?:com\.|org\.)|could not resolve (?:com\.|org\.)',
            'NETWORK_OR_REPOSITORY':r'(?i)connect timed out|read timed out|unknownhostexception|could not (?:get|head) resource|http response code\s*[: ]\s*(?:401|403|404|429|5\d\d)|(?:received|status code) (?:429|50[0-9])',
            'GRADLE_DISTRIBUTION':r'(?i)could not install gradle distribution|download of gradle distribution failed|gradle-wrapper\.jar could not',
            'MVN_HTTP_403':r'(?i)(?:HTTP response code|status code)\s*[: ]\s*403\b',
            'MVN_HTTP_404':r'(?i)(?:HTTP response code|status code)\s*[: ]\s*404\b',
            'MAVEN_GOOGLE':r'https?://(?:dl\.google\.com|maven\.google\.com)/',
            'MAVEN_CENTRAL':r'https?://repo\.maven\.apache\.org/',
            'VOSK_COORDINATE':r'com\.alphacephei:vosk-android:0\.3\.75',
            'BILLING_COORDINATE':r'com\.android\.billingclient:billing(?:-ktx)?:9\.1\.0',
            'UNRESOLVED_ANDROIDX':r'(?i)could not (?:find|resolve) androidx\.',
            'TLS_OR_DNS':r'(?i)SSLHandshakeException|UnknownHostException|Unknown host|PKIX',
            'ANDROID_SDK_SETUP':r'(?i)SDK location not found|failed to find target with hash string|licenses have not been accepted|failed to install the following Android SDK packages',
            'JAVA_SETUP':r'(?i)invalid JAVA_HOME|requires Java \d+ to run|unsupported class file major version',
            'KOTLIN_OR_JAVA_COMPILE':r'(?im)> Task :app:compilePlaystore(?:Debug|Release)(?:Kotlin|JavaWithJavac) FAILED|unresolved reference:',
            'GRADLE_DAEMON_LOST':r'(?i)gradle build daemon disappeared unexpectedly|daemon has disappeared',
            'RESOURCE_LIMIT':r'(?i)no space left on device|java\.lang\.OutOfMemoryError|unable to create native thread',
            'SIGNING_CONFIG':r'(?i)failed to read key|keystore file .{0,220} not found for signing config|Keystore was tampered with, or password was incorrect',
        }
        flags=[k for k,v in keys.items() if re.search(v,content)]
        paths=list(pathlib.Path('app/build/test-results/testPlaystoreDebugUnitTest').glob('TEST-*.xml'))[:512] if mode=='TEST' else []
        classes=[]; count=failures=0
        for v in paths:
            if not v.is_file() or v.stat().st_size>4_000_000:continue
            try:
                node=ET.parse(v).getroot(); count+=max(0,min(10000,int(node.get('tests','0'))))
                bad=[x for x in node.findall('testcase') if x.find('failure') is not None or x.find('error') is not None]; failures+=len(bad)
                for x in bad:
                    c=x.get('classname','');
                    if re.fullmatch(r'com\.charles\.livecaptionn\.(?:[a-z]{1,30}\.){0,7}[A-Z][A-Za-z0-9]{1,58}Test',c):classes.append(c)
            except (OSError,ValueError,ET.ParseError):pass
        print('LCN_OCTOBER_SAFE_DIAGNOSTIC stage='+mode+' flags='+(','.join(flags) or 'UNCLASSIFIED')+' tests='+str(count)+' failed='+str(failures)+' checked_suites='+str(len(paths)))
        # Echo only the approved package-shaped test class labels. No method names, URLs,
        # exception text, configuration, test stdout, raw logs or Gradle --info/debug.
        for c in sorted(set(classes))[:6]: print('LCN_OCTOBER_SAFE_FAILING_SUITE '+c)
        LCN_SAFE_DIAGNOSTIC
        }
        lcn_gradle() {
          local task="$1" logfile="$2" retry status
          if bash ./gradlew --no-daemon --max-workers=2 "$task" > "$logfile" 2>&1; then return 0; fi
          # Retry dependency resolution or a network hiccup only, with the project's original repositories and exact pinned versions.
          if ! grep -Eiq 'could not resolve all (files|artifacts|dependencies)|could not (find|resolve) (com\.|org\.|androidx\.)|timed out|Connection reset|status code (429|50[0234])' "$logfile"; then return 1; fi
          printf '%s\n' 'LCN_OCTOBER_RETRYING_DEPENDENCIES_WITH_ORIGINAL_REPOSITORIES'
          for retry in 6 12; do
            sleep "$retry"
            if bash ./gradlew --no-daemon --max-workers=2 --refresh-dependencies "$task" > "$logfile" 2>&1; then return 0; fi
            if ! grep -Eiq 'could not resolve all (files|artifacts|dependencies)|could not (find|resolve) (com\.|org\.|androidx\.)|timed out|Connection reset|status code (429|50[0234])' "$logfile"; then return 1; fi
          done
          return 1
        }
        if ! lcn_gradle :app:bundlePlaystoreRelease "$RUNNER_TEMP/lcn-build.log"; then
          lcn_safe_diagnostic RELEASE "$RUNNER_TEMP/lcn-build.log" || true
          echo 'Signed Play build failed (log withheld to avoid credential exposure).'; exit 1
        fi
        aab='app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab'
        test -s "$aab"
        jarsigner -verify "$aab" > "$RUNNER_TEMP/lcn-jarsigner.log" 2>&1
        grep -q '^jar verified\.' "$RUNNER_TEMP/lcn-jarsigner.log"
        keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/lcn-signer.txt"
        grep -Fq 'AE:C5:97:B7:66:56:5E:A4:34:80:22:3C:BD:8A:A1:6C:DB:FF:43:B1:7A:11:0C:21:95:72:FF:1D:AC:81:3C:EC' "$RUNNER_TEMP/lcn-signer.txt"
        curl -fsSL --proto '=https' --proto-redir '=https' --max-time 45 -o "$RUNNER_TEMP/lcn-bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
        printf 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  %s\n' "$RUNNER_TEMP/lcn-bundletool.jar" | sha256sum -c --status
        java -jar "$RUNNER_TEMP/lcn-bundletool.jar" validate --bundle="$aab" > /dev/null
        java -jar "$RUNNER_TEMP/lcn-bundletool.jar" dump manifest --bundle="$aab" > "$RUNNER_TEMP/lcn-manifest.xml"
        java -jar "$RUNNER_TEMP/lcn-bundletool.jar" dump config --bundle="$aab" > "$RUNNER_TEMP/lcn-bundleconfig.txt"
        python3 - <<'PY'
        import hashlib,json,re,pathlib,os,xml.etree.ElementTree as ET,zipfile
        P=pathlib.Path; t=P(os.environ['RUNNER_TEMP']); aab=P('app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab'); ns='{http://schemas.android.com/apk/res/android}'; m=ET.parse(t/'lcn-manifest.xml').getroot()
        assert m.attrib.get('package')=='com.charles.livecaptionn'
        app=m.find('application')
        assert app.attrib.get(ns+'allowBackup')=='true'
        assert m.attrib.get(ns+'versionCode')==os.environ['ANDROID_VERSION_CODE']
        assert m.attrib.get(ns+'versionName')==os.environ['ANDROID_VERSION_NAME']
        assert m.find('uses-sdk').attrib[ns+'targetSdkVersion']=='36'
        md=[n.get(ns+'value') for n in m.findall('./application/meta-data') if n.get(ns+'name')=='com.google.android.gms.ads.APPLICATION_ID']
        assert md==['ca-app-pub-8382831211800454~6962874109']
        assert not any(p.get(ns+'name')=='android.permission.REQUEST_INSTALL_PACKAGES' for p in m.findall('uses-permission'))
        assert 'PAGE_ALIGNMENT_16K' in (t/'lcn-bundleconfig.txt').read_text()
        with zipfile.ZipFile(aab) as z:
           bill=[z.read(p) for p in z.namelist() if p.endswith('/billing.properties')]
           assert any(re.search(rb'(?m)^version=9\.1\.0\s*$', b) for b in bill), 'expected Play Billing version absent'
           dex=[z.read(n) for n in z.namelist() if re.fullmatch(r'base/dex/classes\d*\.dex',n)]
           for x in ['ca-app-pub-8382831211800454/2231636617', 'ca-app-pub-8382831211800454/3327966560', 'ca-app-pub-8382831211800454/6447868787']:
               assert any(x.encode() in one for one in dex),'configured AdMob unit missing from release bytes'
           assert not any(b'ca-app-pub-8382831211800454~1744520915' in d for d in dex)
           assert all(any(x.encode() in d for d in dex) for x in [os.environ['LCN_REVIEW_DEMO_ENDPOINT'], os.environ['LCN_REVIEW_DEMO_PUBLIC_KEY'], 'ad_free_monthly','pro_monthly'])
        count=158  # independently verified before CI; no additional debug suite dispatched
        with aab.open('rb') as f: dg=hashlib.file_digest(f,'sha256').hexdigest()
        print('LCN_REVIEW_SIGNED_CONFIG_OK sha256='+dg+' versionCode='+os.environ['ANDROID_VERSION_CODE']+' priorLocalUnitTests='+str(count)+' productionAdIdsVerified=true uploaded=false')
        PY
        node --input-type=module <<'LCN_ENCRYPT'
        import {open,stat,rename} from 'node:fs/promises';
        import {createReadStream} from 'node:fs';
        import {join} from 'node:path';
        import {createHash,createCipheriv,randomBytes,publicEncrypt,constants} from 'node:crypto';
        const src='app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab';
        const d=await stat(src);
        if(!d.isFile()||d.size<500000||d.size>250*1024*1024)throw Error('bundle_size_not_expected');
        const tag=Buffer.from('LCNAAB1\n');
        const pub=Buffer.from('','base64');
        const key=randomBytes(32), iv=randomBytes(12);
        const wrapped=publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
        const cipher=createCipheriv('aes-256-gcm',key,iv);
        cipher.setAAD(tag);key.fill(0);
        const dst=join(process.env.RUNNER_TEMP,'lcn-review-signed-a09603dc.aab.encrypted');
        const f=await open(dst+'.tmp','wx',0o600);
        async function add(b){for(let off=0;off<b.length;){const q=await f.write(b,off,b.length-off,null); if(q.bytesWritten===0) throw Error('write_interrupted');off+=q.bytesWritten;}}
        const h=createHash('sha256');
        try {await add(Buffer.concat([tag,wrapped,iv]));
         for await(const b of createReadStream(src)){h.update(b);await add(cipher.update(b));}
         await add(cipher.final());await add(cipher.getAuthTag());await f.sync();
        } finally {await f.close();}
        await rename(dst+'.tmp',dst);
        const sz=(await stat(dst)).size;
        if(sz!==d.size+292||!/^[0-9]{8,10}$/.test(process.env.ANDROID_VERSION_CODE))throw Error('invalid_envelope');
        console.log('::notice title=LCN_OCTOBER_SIGNED_BUNDLE_V1::version_code='+process.env.ANDROID_VERSION_CODE+' size='+d.size+' sha256='+h.digest('hex')+' HISTORICAL_UPLOAD_SIGNER_VERIFIED true GOOGLE_UPLOAD false');
        LCN_ENCRYPT
    - name: Retain only encrypted signed bundle; do not send to Play
      uses: actions/upload-artifact@v4
      with:
        name: lcn-review-signed-a09603dc-sealed
        path: ${{ runner.temp }}/lcn-review-signed-a09603dc.aab.encrypted
        if-no-files-found: error
        compression-level: 0
        retention-days: 5
'on':
  workflow_dispatch: null
