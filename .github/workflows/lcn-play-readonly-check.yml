name: LiveCaptionN original Play terms and track checks (GET only)
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  inspect:
    if: github.ref == 'refs/heads/play-recovery/lcn-policy-terms-gates-20261120' && github.repository == 'chartmann1590/LiveTranscribe-Android' && github.actor == 'chartmann1590'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - name: Read existing original Play tracks and billing only
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      shell: bash
      run: "node --input-type=module <<'PLAY_READ_ONLY'\nimport {sign,createCipheriv,randomBytes,publicEncrypt,constants} from 'node:crypto';\nconst PKG='com.charles.livecaptionn', ROOT='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/'+PKG, TOKEN='https://oauth2.googleapis.com/token';\nconst trackNames=['production','internal','alpha','beta'];\nconst chosen=['ad_free_monthly','pro_monthly'];\nconst statusClass=e=>['AbortError','TimeoutError','SyntaxError','TypeError'].includes(e?.name)?e.name:'Error';\nfunction getQuery(endpoint,p={}){let u=new URL(endpoint);for(const [k,v] of Object.entries(p))u.searchParams.set(k,v);return u;}\nasync function get(url,bearer,tx){\n if(url.origin!=='https://androidpublisher.googleapis.com'||!url.pathname.startsWith('/androidpublisher/v3/applications/'+PKG+'/'))throw Error('wrong_target');\n try{const r=await tx(url,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+bearer,Accept:'application/json'}});let j={};try{j=await r.json()}catch{};\n  const status=j?.error?.status;\n  return {ok:r.ok,http:r.status,errorState:/^[A-Z0-9_]{1,60}$/.test(status??'')?status:null,j};\n }catch(e){return {ok:false,error:statusClass(e),j:{}};}\n}\nconst identity=v=>typeof v==='string'&&/^[a-z0-9_][a-z0-9_.-]{0,62}$/.test(v);\nconst vcode=v=>/^\\d{1,10}$/.test(String(v));\nconst safeTrack=r=>({lifecycle:((r?.releaseLifecycleState??'').match(/^RELEASE_LIFECYCLE_STATE_([A-Z_]+)$/)||[])[1]??null,review:((r?.reviewState??'').match(/^[A-Z_]{1,95}$/)||[])[0]??null,versions:(Array.isArray(r?.activeArtifacts)?r.activeArtifacts:[]).map(a=>a.versionCode).filter(vcode).map(String)});\nconst info=({ok,http,errorState,error})=>({ok,http,errorState,error});\nconst price=(p)=> p?.currencyCode==='USD'&&Number.isFinite(Number(p.units??'0'))&&Number.isInteger(p.nanos??0)? Math.round(Number(p.units??0)*100+(p.nanos??0)/1e7):null;\nasync function offered(bearer,tx,product,plan){\n let p='', pages=0; const\
        \ out=[]; const seen=new Set();\n do {\n const opts={pageSize:'50',fields:'nextPageToken,subscriptionOffers(packageName,productId,basePlanId,offerId,state,phases,regionalConfigs(regionCode,newSubscriberAvailability))'}; if(p)opts.pageToken=p;\n const res=await get(getQuery(ROOT+'/subscriptions/'+product+'/basePlans/'+plan+'/offers',opts),bearer,tx); if(!res.ok)return {complete:false,...info(res)};\n const rows=res.j.subscriptionOffers??[]; if(!Array.isArray(rows)||rows.some(x=>x.packageName!==PKG||x.productId!==product||x.basePlanId!==plan||!identity(x.offerId)))return {complete:false,problem:'unexpected_offer_identity'};\n for(const o of rows){if(seen.has(o.offerId))return {complete:false,problem:'duplicate_offer_id'};seen.add(o.offerId); const phases=o.phases??[]; out.push({state:o.state??null,usEnabled:!!o.regionalConfigs?.find(x=>x.regionCode==='US'&&x.newSubscriberAvailability===true),phaseTerms:phases.map(ph=>({duration:ph.duration??null,recurrenceCount:ph.recurrenceCount??null,usPhasePrice:price(ph.regionalConfigs?.find(r=>r.regionCode==='US')?.price),usFree:ph.regionalConfigs?.some(r=>r.regionCode==='US'&&r.free!==undefined)??false}))});}\n const next=res.j.nextPageToken??'';if(typeof next!=='string'||(next&&next===p)||++pages>8)return {complete:false,problem:'pagination_incomplete'}; p=next;\n }while(p);\n return {complete:true,offers:out};\n}\nexport async function readVerified(config,tx=fetch){\n if(config?.type!=='service_account'||!config?.client_email?.endsWith('.iam.gserviceaccount.com')||!config?.private_key)throw Error('config');\n const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url'), at=Math.floor(Date.now()/1000);\n const input=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:config.client_email,aud:TOKEN,scope:'https://www.googleapis.com/auth/androidpublisher',iat:at,exp:at+300}); const assertion=input+'.'+sign('RSA-SHA256',Buffer.from(input),config.private_key).toString('base64url');\n const auth=await tx(TOKEN,{method:'POST',redirect:'error',headers:{'content-type':'application/x-www-form-urlencoded'},body:new\
        \ URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion}),signal:AbortSignal.timeout(15000)}); if(!auth.ok)return {oauth_status:auth.status}; const bearer=(await auth.json()).access_token; if(typeof bearer!=='string'||!bearer)throw Error('token');\n const tracks=Promise.all(trackNames.map(async t=>{const r=await get(getQuery(ROOT+'/tracks/'+t+'/releases'),bearer,tx);const rows=r.j?.releases??[];return [t,{...info(r),body_has_releases:'releases'in r.j,rows:r.ok&&Array.isArray(rows)?rows.filter(x=>x?.track===t).slice(0,20).map(safeTrack):null,mismatched_track_rows:Array.isArray(rows)?rows.filter(x=>x?.track!==t).length:null}]}));\n const terms=Promise.all(chosen.map(async product=>{\n  const r=await get(getQuery(ROOT+'/subscriptions/'+product),bearer,tx); if(!r.ok||r.j.packageName!==PKG||r.j.productId!==product)return [product,{...info(r),matched:false}];\n  const plans=(Array.isArray(r.j.basePlans)?r.j.basePlans:[]); if(plans.length>12||plans.some(b=>!identity(b.basePlanId)))return [product,{matched:true,complete:false,problem:'plan_identity'}];\n  const m=await Promise.all(plans.map(async b=>{const us=b.regionalConfigs?.find(v=>v.regionCode==='US');return {state:b.state??null,autoPeriod:b.autoRenewingBasePlanType?.billingPeriodDuration??null,usPriceCents:price(us?.price),usNew:!!us?.newSubscriberAvailability,enabledRegions:(b.regionalConfigs??[]).filter(x=>x.newSubscriberAvailability===true).length,offers:await offered(bearer,tx,product,b.basePlanId)};})); return [product,{matched:true,plans:m}];\n }));\n return {package:PKG,publisherAppliedChanges:false,tracks:Object.fromEntries(await tracks),terms:Object.fromEntries(await terms)};\n}\nconst PUBLIC_B64=\"\"\
        ;\nfunction record(data) {\n  const pub=Buffer.from(PUBLIC_B64,'base64');\n  const key=randomBytes(32), iv=randomBytes(12);\n  const cipher=createCipheriv('aes-256-gcm',key,iv); cipher.setAAD(Buffer.from('LCN_PLAY_READBACK_V2'));\n  const body=Buffer.concat([cipher.update(JSON.stringify(data),'utf8'),cipher.final()]);\n  const wk=publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key); key.fill(0);\n  const sealed=Buffer.concat([wk,iv,cipher.getAuthTag(),body]).toString('base64');\n  if (sealed.length>16384) throw Error('readback_large');\n  console.log('::notice title=LCN_PLAY_READBACK_V2::'+sealed);\n}\n\nasync function main(){try{record(await readVerified(JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON||'')));}catch(e){record({package:PKG,error:statusClass(e),publisherAppliedChanges:false});process.exitCode=1;}}\nawait main();\nPLAY_READ_ONLY\n"
